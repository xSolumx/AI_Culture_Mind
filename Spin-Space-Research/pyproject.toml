[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spin8-triality-research"
version = "0.1.0"
description = "Reproducible Spin geometry, Clifford sensing, Schur-scan, and noncommutative dynamics research harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Hayden Austin" }]
keywords = [
  "state-space-models",
  "geometric-algebra",
  "spin8",
  "triality",
  "noncommutative-recurrence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26",
  "psutil>=6.0",
  "scipy>=1.13",
  "sympy>=1.13",
  "torch>=2.6",
]

[project.optional-dependencies]
exact = [
  "python-flint>=0.9",
]
cuda-windows = [
  "triton-windows==3.7.1.post27; sys_platform == 'win32'",
]
plots = [
  "matplotlib>=3.9",
]
full = [
  "datasets>=4.0",
  "flax>=0.10.7",
  "jax>=0.7.0",
  "optax>=0.2.5",
  "tiktoken>=0.9.0",
]

[project.urls]
Repository = "https://github.com/xSolumx/spin8-triality-research"
Documentation = "https://github.com/xSolumx/spin8-triality-research/tree/main/docs"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.setuptools]
package-dir = { "" = "src" }
