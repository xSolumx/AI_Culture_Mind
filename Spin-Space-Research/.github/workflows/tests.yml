name: tests

on:
  push:
  pull_request:

jobs:
  foundational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[full,exact]"
      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py"
